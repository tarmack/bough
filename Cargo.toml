[package]
name = "bough"
version = "0.1.0"
edition = "2021"
description = "A minimalist terminal tree-diff viewer"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["parsing", "plist-load", "regex-onig"] }
two-face = "0.5"
notify = "8"
crossbeam-channel = "0.5"
gix = { version = "0.87", features = ["default", "status"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
