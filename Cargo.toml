[package]
name = "bough"
version = "0.1.0"
edition = "2021"
description = "A minimalist terminal tree-diff viewer"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["parsing", "plist-load", "regex-onig"] }
two-face = "0.5"
notify = "6"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"